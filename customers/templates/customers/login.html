{% extends 'customers/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card card-custom">
      <div class="card-body p-4">

        <div class="text-center mb-4">
          <i class="bi bi-shield-lock-fill text-primary" style="font-size:3rem;"></i>
          <h4 class="page-title mt-2">Sign in</h4>
          <p class="text-secondary small mb-0">SSGC Customer Registration</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger py-2 small">
          Wrong username or password. Please try again.
        </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">

          <div class="mb-3">
            <label for="id_username" class="form-label small fw-semibold">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus required>
          </div>

          <div class="mb-3">
            <label for="id_password" class="form-label small fw-semibold">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login
          </button>
        </form>

      </div>
    </div>
  </div>
</div>

{% endblock %}
